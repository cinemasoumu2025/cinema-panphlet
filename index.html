<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="シネマクラブのイベントパンフレット一覧">
  <title>シネマクラブのパンフレット一覧</title>
  <style>
    :root {
      --bg: #f5f6f8; --surface: #fff; --ink: #20242b; --muted: #737b87;
      --line: #e5e8ed; --accent: #344b68; --accent-soft: #eaf0f6;
      --shadow: 0 8px 28px rgba(31, 43, 58, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    .wrap { width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 42px 0 64px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 30px; }
    h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.35rem); letter-spacing: .02em; line-height: 1.3; }
    .subtitle { margin: 9px 0 0; color: var(--muted); font-size: .92rem; }
    .clock { text-align: right; color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .clock strong { display: block; color: var(--ink); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
    .panel h2 { margin: 0 0 18px; font-size: 1.05rem; }
    .filter-group + .filter-group { margin-top: 18px; }
    .filter-title { display: block; margin-bottom: 9px; color: var(--muted); font-size: .83rem; font-weight: 700; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
      display: inline-flex; align-items: center; min-height: 36px; padding: 6px 13px;
      border: 1px solid var(--line); border-radius: 999px; background: #fff;
      color: #505966; font-size: .86rem; cursor: pointer; transition: .15s ease;
    }
    .choice input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
    .choice input:focus-visible + span { outline: 3px solid #b7c9dd; outline-offset: 2px; }
    .results-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 30px 2px 14px; }
    .results-head h2 { margin: 0; font-size: 1.12rem; }
    .sort-controls {
  display: flex;
  gap: 6px;
  margin-left: auto;
}

.sort-button {
  padding: 7px 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.8rem;
}

.sort-button.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
    .count { color: var(--muted); font-size: .86rem; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column; min-height: 205px; padding: 20px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 17px;
      box-shadow: var(--shadow); text-decoration: none; color: inherit;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: #c8d3df; box-shadow: 0 13px 32px rgba(31,43,58,.10); }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .tag { padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .75rem; font-weight: 700; }
    .date { color: var(--muted); font-size: .8rem; white-space: nowrap; }
    .card h3 { margin: 18px 0 10px; font-size: 1.12rem; line-height: 1.45; }
    .target { color: var(--muted); font-size: .82rem; }
    .open-label { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 18px; color: var(--accent); font-size: .85rem; font-weight: 700; }
    .message { grid-column: 1 / -1; padding: 34px 18px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed #d9dee5; border-radius: 16px; }
    .status { margin: 13px 2px 0; color: var(--muted); font-size: .78rem; }
    footer { margin-top: 35px; color: #8a919b; text-align: center; font-size: .75rem; }
    @media (max-width: 820px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) {
      .wrap { width: min(100% - 26px, 1120px); padding-top: 28px; }
      header { align-items: start; flex-direction: column; gap: 12px; }
      .clock { text-align: left; }
      .clock strong { display: inline; margin-left: 7px; }
      .panel { padding: 17px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>シネマクラブの<br>パンフレット一覧</h1>
        <p class="subtitle">イベントのパンフレットを探す</p>
      </div>
      <div class="clock">現在時刻<strong id="clock">----</strong></div>
    </header>

    <section class="panel" aria-labelledby="filter-heading">
      <h2 id="filter-heading">絞り込み</h2>
      <div class="filter-group">
        <span class="filter-title">イベント種別（複数選択可）</span>
        <div class="choices" id="type-filters"></div>
      </div>
      <div class="filter-group">
        <span class="filter-title">パンフレットの対象者・言語（複数選択可）</span>
        <div class="choices" id="target-filters"></div>
      </div>
      <div class="filter-group">
        <span class="filter-title">年（複数選択可）</span>
        <div class="choices" id="year-filters"></div>
      </div>
      <p class="status" id="status" aria-live="polite">データを読み込んでいます…</p>
    </section>

<div class="results-head">
  <h2>パンフレット</h2>

  <div class="sort-controls">
    <button class="sort-button active" data-sort="desc">
      新しい順
    </button>

    <button class="sort-button" data-sort="asc">
      古い順
    </button>
  </div>

  <span class="count" id="count">— 件</span>
</div>

<section class="cards" id="cards" aria-live="polite">
  <div class="message">
    スプレッドシートからデータを読み込んでいます。
  </div>
</section>

<footer>シネマクラブ</footer>
  </main>

  <script>
    // Google Apps ScriptをウェブアプリとしてデプロイしたURLを設定してください。
    const API_URL = "https://script.google.com/macros/s/AKfycbxS1aGBjXtk_PnS0LxAqw4oV19jkN3sbtxluA1-N32Q0v91TfQ3zaZD1yRjnngl7maS/exec";

    const EVENT_TYPES = ["友好祭", "白鷺祭", "森之宮"];
    const TARGETS = ["A_大人", "B_一般", "C_こども", "E_English"];
    let pamphlets = [];
    // 並び替えの初期設定
  let sortOrder = "desc";

    // 並び替えボタンの動作
  document.querySelectorAll(".sort-button").forEach(button => {
  button.addEventListener("click", () => {

    sortOrder = button.dataset.sort;

    // 選択中のボタンの色を変更
    document.querySelectorAll(".sort-button").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    // 一覧を再表示
    renderCards();
  });
});

    function updateClock() {
      document.getElementById("clock").textContent =
        new Intl.DateTimeFormat("ja-JP", {
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false
        }).format(new Date());
    }
    updateClock();
    setInterval(updateClock, 1000);

    function getSessionId() {
      let id = localStorage.getItem("cinema_pamphlet_session");
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() :
          "s-" + Date.now() + "-" + Math.random().toString(36).slice(2));
        localStorage.setItem("cinema_pamphlet_session", id);
      }
      return id;
    }

    function logAction(action, item = {}) {
      if (!API_URL.startsWith("https://script.google.com/")) return;
      const payload = {
        action, sessionId: getSessionId(), page: location.href,
        eventName: item.name || "", eventType: item.type || "",
        year: item.year || "", month: item.month || "",
        target: item.target || "", url: item.url || ""
      };
      // no-corsで送信するため応答は読み取りません。ログ記録は非同期です。
      fetch(API_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(() => {});
    }

    function loadData() {
      if (!API_URL.startsWith("https://script.google.com/")) {
        document.getElementById("status").textContent =
          "設定が必要です：index.html内のAPI_URLにウェブアプリURLを設定してください。";
        document.getElementById("cards").innerHTML =
          '<div class="message">Google Apps ScriptのURLがまだ設定されていません。</div>';
        return;
      }
      const callbackName = "receivePamphletData";
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (!data || !data.ok) {
          showError((data && data.error) || "データを取得できませんでした。");
          return;
        }
        pamphlets = data.items || [];
        buildFilters();
        renderCards();
        document.getElementById("status").textContent = "スプレッドシートの情報を読み込みました。";
        logAction("アクセス");
      };
      const script = document.createElement("script");
      script.src = API_URL + "?action=events&callback=" + callbackName + "&_=" + Date.now();
      script.onerror = () => showError("データを取得できません。URLと公開設定を確認してください。");
      document.head.appendChild(script);
    }

    function showError(message) {
      document.getElementById("status").textContent = message;
      document.getElementById("cards").innerHTML =
        '<div class="message">データを表示できませんでした。管理者にお問い合わせください。</div>';
    }

    function addFilter(containerId, values, groupName) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      values.forEach((value, index) => {
        const label = document.createElement("label");
        label.className = "choice";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.name = groupName;
        input.value = String(value);
        input.id = groupName + "-" + index;
        input.addEventListener("change", renderCards);
        const span = document.createElement("span");
        span.textContent = value;
        label.append(input, span);
        container.appendChild(label);
      });
    }

    function buildFilters() {
      const years = [...new Set(pamphlets.map(p => Number(p.year)).filter(Number.isFinite))]
        .sort((a, b) => b - a).map(String);
      addFilter("type-filters", EVENT_TYPES, "type");
      addFilter("target-filters", TARGETS, "target");
      addFilter("year-filters", years, "year");
    }

    function selectedValues(name) {
      return [...document.querySelectorAll('input[name="' + name + '"]:checked')].map(el => el.value);
    }

    function safeHttpUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
      } catch (_) { return ""; }
    }

    function renderCards() {
      const types = selectedValues("type");
      const targets = selectedValues("target");
      const years = selectedValues("year");
      const filtered = pamphlets.filter(p =>
        (!types.length || types.includes(p.type)) &&
        (!targets.length || targets.includes(p.target)) &&
        (!years.length || years.includes(String(p.year)))
      ).sort((a, b) => {

  const dateA = Number(a.year) * 12 + Number(a.month);
  const dateB = Number(b.year) * 12 + Number(b.month);

  return sortOrder === "desc"
    ? dateB - dateA
    : dateA - dateB;

});

      document.getElementById("count").textContent = filtered.length + " 件";
      const cards = document.getElementById("cards");
      cards.replaceChildren();

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "message";
        empty.textContent = "条件に一致するパンフレットはありません。";
        cards.appendChild(empty);
        return;
      }

      filtered.forEach(p => {
        const url = safeHttpUrl(p.url);
        const card = document.createElement(url ? "a" : "article");
        card.className = "card";
        if (url) {
          card.href = url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.addEventListener("click", () => logAction("クリック", p));
        }
        const top = document.createElement("div");
        top.className = "card-top";
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = p.type;
        const date = document.createElement("span");
        date.className = "date";
        date.textContent = p.year + "年 " + p.month + "月";
        top.append(tag, date);

        const title = document.createElement("h3");
        title.textContent = p.name;
        const target = document.createElement("div");
        target.className = "target";
        target.textContent = p.target;
        card.append(top, title, target);

        if (url) {
          const open = document.createElement("div");
          open.className = "open-label";
          const text = document.createElement("span");
          text.textContent = "パンフレットを見る";
          const arrow = document.createElement("span");
          arrow.textContent = "↗";
          open.append(text, arrow);
          card.appendChild(open);
        }
        cards.appendChild(card);
      });
    }

    loadData();
  </script>
</body>
</html>
